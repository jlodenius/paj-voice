context.modules = [
  {
    name = libpipewire-module-echo-cancel
    args = {
      library.name = aec/libspa-aec-webrtc
      audio.rate = 48000
      audio.channels = 1
      audio.position = [ MONO ]
      capture.props = {
        node.name = paj_voice_aec_capture
        node.passive = true
        target.object = REPLACE_WITH_PHYSICAL_MIC_NODE_NAME
        node.dont-fallback = true
        node.dont-reconnect = true
      }
      source.props = {
        media.class = Audio/Source
        node.name = paj_voice_source
        node.description = "Paj voice echo-cancelled microphone"
        priority.session = 0
      }
      sink.props = {
        media.class = Audio/Sink
        node.name = paj_voice_sink
        node.description = "Paj voice echo reference playback"
        priority.session = 0
      }
      playback.props = {
        node.name = paj_voice_aec_playback
        node.passive = true
        target.object = REPLACE_WITH_PHYSICAL_HEADPHONES_NODE_NAME
        node.dont-fallback = true
        node.dont-reconnect = true
      }
    }
  }
]
